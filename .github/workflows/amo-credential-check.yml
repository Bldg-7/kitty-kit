name: AMO Credential Check

# Manually triggered from the Actions tab. Verifies the Firefox AMO API
# credentials authenticate, WITHOUT uploading or submitting anything (uses
# `wxt submit --dry-run`). Safe to run any time to confirm the secrets work
# before a real release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      FIREFOX_EXTENSION_ID: settimeout1000@gmail.com
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail early if AMO secrets are missing
        run: |
          if [ -z "$FIREFOX_JWT_ISSUER" ] || [ -z "$FIREFOX_JWT_SECRET" ]; then
            echo "::error::FIREFOX_JWT_ISSUER / FIREFOX_JWT_SECRET are not set as repository secrets."
            exit 1
          fi

      - name: Build Firefox zip (+ sources)
        run: npm run zip:firefox

      - name: Validate AMO authentication (dry run — no upload, no submit)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx wxt submit --dry-run \
            --firefox-zip ".output/kitty-kit-${VERSION}-firefox.zip" \
            --firefox-sources-zip ".output/kitty-kit-${VERSION}-sources.zip"
